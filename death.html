<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121619"><title>第六の錬成</title><link rel="stylesheet" href="death.css?v=1"><script type="module" src="death.js?v=2"></script></head><body>
<canvas id="room-canvas" aria-label="一人称視点の部屋。WASDで移動、ドラッグで見回す、Eで調べる。"></canvas><div class="room-vignette" aria-hidden="true"></div>
<div id="room-fallback" hidden><button data-world="monitor">正面のモニター</button><button data-world="wood">木の机</button><button data-world="glass">透明な机</button><button data-world="opponent">対面の男</button><button data-world="deck">53枚の複製見本</button><button data-world="dice">自分のサイコロ</button><button data-world="shelf">本棚</button><button data-world="door">扉</button></div>
<section id="title-screen"><a href="./" class="return-link">← ゲーム選択</a><div class="title-copy"><p class="eyebrow">SIX CASTS. ONE EXIT.</p><h1>第六の錬成</h1><p>六投で揃えろ。扉の向こうへ。</p><button id="new-session" class="gold-button">新しいゲーム</button><button id="continue-session">続きから</button><button id="title-controls" class="text-button">操作</button><p id="title-status" role="status">部屋を準備しています…</p></div><span class="title-mark" aria-hidden="true">VI</span></section>
<main id="play-screen" hidden><header class="play-header"><div><span class="game-name">第六の錬成</span><strong id="round-label">第1投 / 6</strong><small id="phase-label"></small></div><button id="open-menu">メニュー</button></header><div class="crosshair" aria-hidden="true"></div><div id="look-hint"></div><div class="touch-pad"><button data-step="left" aria-label="左へ">←</button><button data-step="forward" aria-label="前へ">↑</button><button data-step="back" aria-label="後ろへ">↓</button><button data-step="right" aria-label="右へ">→</button><button id="crouch-button">屈む</button></div><section class="command-console"><p id="narration" role="status" aria-live="polite"></p><div class="console-heading"><span id="inventory-summary"></span><div id="letter-bank" aria-label="持っているアルファベット"></div></div><form id="command-form"><label class="visually-hidden" for="command">行動を指示する</label><input id="command" autocomplete="off" placeholder="どうする？" maxlength="240"><button type="submit" class="gold-button">実行</button></form></section></main>
<dialog id="game-dialog"><div id="dialog-content"></div><p id="dialog-feedback" role="status" aria-live="polite"></p><form id="dialog-command-form" hidden><label class="visually-hidden" for="dialog-command">行動を指示する</label><input id="dialog-command" maxlength="240" autocomplete="off" placeholder="どうする？"><button type="submit" class="gold-button">実行</button></form></dialog>
</body></html>
