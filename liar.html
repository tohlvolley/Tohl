<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ライアーゲーム</title><meta name="theme-color" content="#121619"><link rel="stylesheet" href="story-editor.css?v=1"><link rel="stylesheet" href="liar.css?v=4"><link rel="stylesheet" href="campaign-ui.css?v=2"><script type="module" src="first-round.js?v=9"></script></head><body>
<canvas id="hall" aria-label="1回戦の会場。WASDで移動、ドラッグで見回す、Eで調べる"></canvas><div class="shade"></div>
<section id="title" class="overlay"><a href="./" class="back">← ゲーム選択</a><div class="title-card"><small>LIAR GAME</small><h1>ライアーゲーム</h1><p>1回戦から、次の部屋へ。</p><button id="new">ゲームを開始</button><button id="continue">続きから</button><button id="editor-open" class="quiet">1回戦のゲームエディタ</button><button id="second-editor-open" class="quiet">2回戦のゲームエディタ</button><p id="title-message" role="status"></p></div></section>
<main id="play" hidden><header><div><small>ROUND 01 / 16 PARTICIPANTS</small><small id="question-number"></small><h2 id="prompt"></h2></div><div><button id="menu">メニュー</button></div></header><div id="crosshair">+</div><div id="hint"></div><aside id="inventory"><small>持ち物 <output id="inventory-count">0 / 3</output></small><span id="held">なし</span><div id="inventory-actions"></div><button id="combine" hidden>道具を組み合わせる</button></aside><section id="dialog" class="dialog" hidden><button id="dismiss" class="close" aria-label="閉じる">×</button><small id="speaker"></small><p id="text"></p><div id="choices"></div><form id="declaration" hidden><label for="answer">アイテム名</label><input id="answer" maxlength="80" autocomplete="off"><button>宣言する</button></form></section><div class="move-pad"><button data-move="a" aria-label="左へ">←</button><button data-move="w" aria-label="前へ">↑</button><button data-move="s" aria-label="後ろへ">↓</button><button data-move="d" aria-label="右へ">→</button><button id="touch-use">調べる</button></div></main>
<section id="editor" class="overlay" hidden><div class="editor-shell"><header><h1>1回戦の設定</h1><button id="editor-close">閉じる</button></header><p class="note">保存した設定は、このブラウザで次に始めるゲームに反映されます。</p><form id="config-form"><label>冒頭の場面（1行1場面・話者｜本文）<textarea id="config-opening" rows="8"></textarea></label><label>GMの説明（空行で次のセリフへ）<textarea id="config-intro" maxlength="8000" required></textarea></label><h2>問題セット</h2><p class="note">通常のお題は、固定枠を除いた残りの枠に重複なしで抽選します。負けイベント・特殊お題には出題位置を指定してください。内部時間はプレイヤーには表示しません。</p><output id="question-count"></output><div id="config-questions"></div><button type="button" id="add-question">＋ お題を追加</button><h2>会場の道具</h2><div id="config-items"></div><button type="button" id="add-item">＋ アイテムを追加</button><footer><button type="button" id="export">JSONを出力</button><button type="button" id="import">JSONを読み込む</button><input id="import-file" type="file" accept=".json,application/json" hidden><button type="submit">保存して反映</button></footer><p id="config-status" role="status"></p></form></div></section>
<div id="blackout" hidden><p id="blackout-text"></p></div><div id="fallback" hidden><canvas id="map" width="720" height="900" aria-label="部屋の平面図。クリックで移動します"></canvas><small>3D表示が使えないため平面図で表示しています。マップをクリックして移動し、品や提出台を調べてください。</small></div>
</body></html>
