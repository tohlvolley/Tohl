<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>スライドパズル</title><link rel="stylesheet" href="style.css?v=arcade-15"><link rel="stylesheet" href="arcade.css?v=15"><script src="sliding.js?v=15" defer></script></head><body class="arcade"><main class="arcade-shell puzzle-shell"><div class="puzzle-heading"><h1>スライドパズル</h1><a class="secondary" href="./">ゲーム選択へ</a></div><div class="puzzle-settings"><label for="puzzle-size">盤面<select id="puzzle-size"><option value="3">3 × 3</option><option value="4">4 × 4</option></select></label></div><div class="puzzle-stats"><span>手数 <strong id="puzzle-moves">0</strong></span><span>時間 <strong id="puzzle-time">0:00</strong></span><span>最少手数 <strong id="puzzle-best">—</strong></span></div><div id="puzzle-board" class="puzzle-board" role="group" tabindex="0" aria-label="数字を順番に並べる盤面"></div><p id="puzzle-status" class="puzzle-status" role="status" aria-live="polite"></p><div class="puzzle-actions"><button id="puzzle-new" class="primary">新しい問題</button><button id="puzzle-retry" class="secondary">同じ問題をやり直す</button></div><p class="puzzle-help">空白の隣の数字を押して動かします。左上から数字を順番に並べ、右下を空白にするとクリア。盤面内で矢印キーを押すと、空白をその方向へ動かせます。</p></main></body></html>
