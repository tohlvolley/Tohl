<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151b29"><title>五界の旅人 — RPG</title><link rel="stylesheet" href="rpg.css?v=20"><script src="rpg-data.js?v=20" defer></script><script src="rpg-kanji-data.js?v=20" defer></script><script src="rpg-kanji.js?v=20" defer></script><script src="rpg-engine.js?v=20" defer></script><script src="rpg-art.js?v=20" defer></script><script src="rpg-studio.js?v=20" defer></script><script src="rpg-kanji-ui.js?v=20" defer></script><script src="rpg.js?v=20" defer></script></head><body><div id="scene-fade" aria-hidden="true"></div>
<header class="site-head"><a href="./">← ゲーム選択</a><span>五界の旅人</span><button id="test-back" hidden>試遊を終了して制作室へ</button></header>
<main>
<section id="title-view" class="title-view simple-title"><div class="start-card"><h1>五界の旅人</h1><label>名前を決める<input id="hero-name" maxlength="20" value="旅人" autocomplete="off"></label><button id="new-adventure" class="primary">ゲームを開始する</button><p id="start-status" class="status" role="status"></p><input id="hero-job" type="hidden" value="warrior"><input id="hero-element" type="hidden" value="wood"><button id="continue-adventure" hidden>つづきから</button></div></section>
<section id="adventure-view" hidden><button id="open-menu" aria-label="メニューを開く">メニュー</button><div class="journey-heading"><div><p id="world-label" class="eyebrow"></p><h1 id="map-name"></h1></div><div class="toolbar"><button id="open-journal">依頼・旅の記録</button><button id="open-map">地図</button><button id="open-kanji">漢字・画数</button><button id="open-wallet">所持金</button><button id="open-inventory">道具・能力</button><button id="save-adventure">セーブ</button><button id="open-studio">制作室</button><button id="adventure-title">タイトルへ</button></div></div><div class="adventure-layout"><div class="screen-column"><div id="field-view" class="field-view"><canvas id="field-canvas" width="384" height="288" tabindex="0" aria-label="冒険マップ。矢印キーで移動、Spaceで調べる。"></canvas><div class="field-caption"><span id="field-coordinates"></span><span id="interaction-hint"></span></div></div><div id="battle-view" class="battle-view" hidden><div class="enemy-info"><div><strong id="enemy-name"></strong><span id="enemy-element" class="element-pill"></span></div><div class="meter enemy-meter"><i id="enemy-hp-bar"></i></div><small id="enemy-hp"></small></div><canvas id="battle-canvas" width="960" height="420" aria-label="敵との戦闘画面"></canvas><div class="battle-vitals"><span id="battle-hero-hp"></span><span id="battle-hero-mp"></span></div><div id="battle-warning" class="battle-warning"></div><section id="battle-preparation" hidden><h2>戦闘前の漢字設定</h2><div class="kanji-prepare-controls"><label>構える漢字（自由入力）<input id="battle-kanji-input" value="一" autocomplete="off" spellcheck="false"></label><button id="battle-begin" class="primary">この漢字で戦う</button><button id="preparation-book" hidden>対応表を見る</button></div><p id="preparation-status" class="status" role="status"></p><div id="preparation-preview"></div></section><section id="stroke-cast-panel" hidden></section><div id="battle-log" class="battle-log" role="log" aria-live="polite"></div><div class="battle-commands"><button id="battle-attack" class="primary">たたかう</button><button id="battle-magic">画を選んで発動</button><button id="battle-item">道具</button><button id="battle-guard">身を守る</button><button id="battle-flee">逃げる</button></div></div><div class="touch-controls"><button data-move="up" aria-label="上へ">↑</button><button data-move="left" aria-label="左へ">←</button><button id="interact-button" class="primary">話す・調べる</button><button data-move="right" aria-label="右へ">→</button><button data-move="down" aria-label="下へ">↓</button></div><p id="adventure-notice" hidden class="notice" role="status" aria-live="polite"></p></div><aside class="hero-panel"><div class="hero-heading"><strong id="hero-label"></strong><span id="hero-attribute" class="element-pill"></span></div><div class="stat-line"><span>HP</span><strong id="hero-hp"></strong></div><div class="meter hp"><i id="hero-hp-bar"></i></div><div class="stat-line"><span>MP</span><strong id="hero-mp"></strong></div><div class="meter mp"><i id="hero-mp-bar"></i></div><div class="stat-line"><span>EXP</span><strong id="hero-exp"></strong></div><div class="meter xp"><i id="hero-exp-bar"></i></div><div class="stat-line gold"><span>所持金</span><strong id="hero-gold"></strong></div><p id="hero-kanji" class="subtle"></p><p id="hero-condition" class="subtle"></p><canvas id="minimap" width="220" height="165" aria-label="探索済みの範囲"></canvas><h2>いまの目的</h2><p id="main-objective"></p><p class="subtle">宿でHP・MPを回復。商店では道具と装備を購入できます。守護者の属性に強い術を選ぶと有利です。</p></aside></div></section>
<section id="studio-view" hidden><div class="journey-heading"><div><p class="eyebrow">RPG STUDIO</p><h1>RPG制作室</h1></div><div class="toolbar"><button id="studio-undo">元に戻す</button><button id="studio-redo">やり直す</button><button id="studio-test" class="primary">選んだマップを試遊</button><button id="studio-save">編集内容を保存</button><button id="studio-export">JSONを書き出す</button><label class="file-button">JSONを読み込む<input id="studio-import" type="file" accept=".json,application/json"></label><button id="studio-title">タイトルへ</button></div></div><p id="studio-status" class="status" role="status"></p><nav id="studio-tabs" class="studio-tabs" aria-label="編集の種類"><button data-tab="maps" class="active">マップ・ステージ</button><button data-tab="enemies">敵</button><button data-tab="characters">キャラ</button><button data-tab="dialogs">会話・文章</button><button data-tab="flags">フラグ</button><button data-tab="kanjiEffects">漢字の効果</button></nav><div class="studio-layout"><div class="studio-preview"><div id="studio-map-tools" class="toolbar"><label>道具<select id="map-tool"><option value="paint">地形を塗る</option><option value="event">イベントを置く</option><option value="select">イベントを選ぶ</option><option value="erase">イベントを消す</option><option value="spawn">開始位置</option></select></label><label>地形<select id="map-terrain"></select></label><p>ドラッグで地形を塗れます。イベントの配置後は右側で内容を設定します。</p></div><div class="editor-canvas-scroll"><canvas id="studio-canvas" width="1120" height="840" aria-label="マップの編集。クリックとドラッグで配置。"></canvas></div><div id="studio-preview-notes" class="subtle"></div></div><aside id="studio-form" class="studio-form"></aside></div><p class="subtle">編集内容はこのブラウザ用です。JSONで別の端末へ持ち出せます。試遊中は冒険のセーブを上書きしません。条件は「すべて満たす」方式で、会話の選択肢やイベントに設定できます。</p></section>
</main><dialog id="rpg-modal" class="rpg-modal"><div id="modal-content"></div></dialog><script>window.addEventListener('error',()=>{const p=document.getElementById('start-status');if(p)p.textContent='読み込みに失敗しました。ページを再読み込みしてください。';});</script></body></html>
