<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ライアーゲーム</title><meta name="theme-color" content="#121619"><link rel="stylesheet" href="story-editor.css?v=1"><link rel="stylesheet" href="liar.css?v=2"><script type="module" src="first-round.js?v=2"></script></head><body>
<canvas id="hall" aria-label="1回戦の会場。WASDで移動、ドラッグで見回す、Eで調べる"></canvas><div class="shade"></div>
<section id="title" class="overlay"><a href="./" class="back">← ゲーム選択</a><div class="title-card"><small>LIAR GAME</small><h1>ライアーゲーム</h1><p>1回戦から、次の部屋へ。</p><button id="new">ゲームを開始</button><button id="continue">続きから</button><button id="editor-open" class="quiet">1回戦のゲームエディタ</button><button id="second-editor-open" class="quiet">2回戦のゲームエディタ</button><p id="title-message" role="status"></p></div></section>
<main id="play" hidden><header><div><small>ROUND 01 / 16 PARTICIPANTS</small><h2 id="prompt"></h2></div><div><output id="timer" aria-label="残り時間"></output><button id="menu">メニュー</button></div></header><div id="crosshair">+</div><div id="hint"></div><aside id="inventory"><small>持ち物</small><span id="held">なし</span><button id="put-back" hidden>元の場所に戻す</button></aside><section id="dialog" class="dialog" hidden><button id="dismiss" class="close" aria-label="閉じる">×</button><small id="speaker"></small><p id="text"></p><div id="choices"></div><form id="declaration" hidden><label for="answer">アイテム名</label><input id="answer" maxlength="80" autocomplete="off"><button>宣言する</button></form></section><div class="move-pad"><button data-move="a" aria-label="左へ">←</button><button data-move="w" aria-label="前へ">↑</button><button data-move="s" aria-label="後ろへ">↓</button><button data-move="d" aria-label="右へ">→</button><button id="touch-use">調べる</button></div></main>
<section id="editor" class="overlay" hidden><div class="editor-shell"><header><h1>1回戦の設定</h1><button id="editor-close">閉じる</button></header><p class="note">お題と品は仮設定です。保存した設定は、このブラウザで次に始めるゲームに反映されます。</p><form id="config-form"><div class="config-row"><label>最初の文字<input id="config-start" required maxlength="8"></label><label>最後の文字<input id="config-end" required maxlength="8"></label><label>制限時間（秒）<input id="config-seconds" type="number" min="5" max="3600" required></label></div><label>GMの説明<textarea id="config-intro" maxlength="4000" required></textarea></label><div id="config-items"></div><button type="button" id="add-item">＋ アイテムを追加</button><footer><button type="button" id="export">JSONを出力</button><button type="button" id="import">JSONを読み込む</button><input id="import-file" type="file" accept=".json,application/json" hidden><button type="submit">保存して反映</button></footer><p id="config-status" role="status"></p></form></div></section>
<div id="blackout" hidden><p id="blackout-text"></p></div><div id="fallback" hidden><canvas id="map" width="720" height="900" aria-label="部屋の平面図。クリックで移動します"></canvas><small>3D表示が使えないため平面図で表示しています。マップをクリックして移動し、品や提出台を調べてください。</small></div>
</body></html>
